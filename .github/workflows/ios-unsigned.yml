name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Bundle ID 前缀（改成你自己的，别和别人撞）"
        default: "com.yglink.app"
        required: true
      app_name:
        description: "手机桌面显示名"
        default: "YG Link"
        required: true
      app_ref:
        description: "上游 sing-box-for-apple 分支/提交"
        default: "dev"
        required: true
      sb_ref:
        description: "上游 sing-box 内核分支/标签"
        default: "testing"
        required: true

env:
  SB_REPO: https://github.com/SagerNet/sing-box.git
  APP_REPO: https://github.com/SagerNet/sing-box-for-apple.git

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          set -e
          echo "可用 Xcode:"
          ls -d /Applications/Xcode*.app || true
          XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "使用: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: 安装 gomobile / gobind（上游 FindMobile 只认 GOPATH/bin/gobind）
        run: |
          set -e
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          GB="$(go env GOPATH)/bin"
          echo "$GB" >> "$GITHUB_PATH"
          export PATH="$GB:$PATH"
          ls -la "$GB"
          gobind -version || true
          gomobile version || true

      - name: 克隆上游（目录名必须和上游脚本约定一致）
        run: |
          set -e
          git clone --depth 1 --branch "${{ github.event.inputs.sb_ref || 'testing' }}" "$SB_REPO" sing-box
          git clone --depth 1 --branch "${{ github.event.inputs.app_ref || 'dev' }}" \
            --recurse-submodules --shallow-submodules "$APP_REPO" sing-box-for-apple
          echo "内核提交: $(git -C sing-box rev-parse --short HEAD)"
          echo "客户端提交: $(git -C sing-box-for-apple rev-parse --short HEAD)"

      - name: 构建 Libbox.xcframework
        env:
          GOFLAGS: "-p=1"
          GOMAXPROCS: "2"
        run: |
          set -e
          echo "内存："; sysctl hw.memsize 2>/dev/null || true
          echo "CPU："; sysctl -n hw.ncpu 2>/dev/null || true
          cd sing-box
          # 上游给 gomobile 传了 -v，包名刷屏会把真正的报错挤掉，先删掉这一行
          if [ -f cmd/internal/build_libbox/main.go ]; then
            sed -i '' '/^[[:space:]]*"-v",$/d' cmd/internal/build_libbox/main.go || true
            echo "已去除 -v："; grep -c '"-v"' cmd/internal/build_libbox/main.go || true
          fi
          set +e
          go run ./cmd/internal/build_libbox -target apple -platform ios > ../libbox-build.log 2>&1
          RC=$?
          set -e
          echo "go build 退出码 = $RC"
          echo "=== 磁盘 ==="; df -h / | tail -2
          echo "=== 内存 ==="; vm_stat | head -8
          if [ $RC -ne 0 ]; then
            echo "=== 完整日志最后 100 行 ==="
            tail -100 ../libbox-build.log
            exit 1
          fi
          tail -5 ../libbox-build.log
          cd ..
          if [ ! -d sing-box-for-apple/Libbox.xcframework ]; then
            echo "上游未自动拷贝，手动补齐"
            XCF="$(find sing-box -maxdepth 4 -name 'Libbox.xcframework' -type d | head -1)"
            test -n "$XCF"
            cp -R "$XCF" sing-box-for-apple/Libbox.xcframework
          fi
          du -sh sing-box-for-apple/Libbox.xcframework
          ls -la sing-box-for-apple/Libbox.xcframework

      - name: 兼容补丁（runner 的 Xcode 比上游要求的旧）
        run: |
          set -e
          # nonisolated deinit 是 Swift 6.2 语法，Xcode 16 不认；deinit 本身在旧版就是 nonisolated
          grep -rl "nonisolated deinit" sing-box-for-apple --include=*.swift 2>/dev/null | while read -r f; do
            sed -i '' 's/^\([[:space:]]*\)nonisolated deinit {/\1deinit {/' "$f"
            echo "fixed: $f"
          done
          echo "剩余 nonisolated deinit: $(grep -rl 'nonisolated deinit' sing-box-for-apple --include=*.swift 2>/dev/null | wc -l)"
          python3 scripts/patch_swift.py sing-box-for-apple
          python3 scripts/patch_fs.py

      - name: 替换品牌
        env:
          APP_ID: ${{ github.event.inputs.app_id || 'com.yglink.app' }}
          APP_NAME: ${{ github.event.inputs.app_name || 'YG Link' }}
        run: |
          bash scripts/rebrand.sh sing-box-for-apple "$APP_ID" "$APP_NAME"
          python3 scripts/patch_brand.py "$APP_ID"

      - name: 注入登录门（A 方案）
        run: |
          set -e
          cp swift/YGLogin.swift sing-box-for-apple/SFI/YGLogin.swift
          python3 scripts/patch_app.py
          echo "--- Application.swift 现状 ---"
          sed -n '1,30p' sing-box-for-apple/SFI/Application.swift

      - name: 编译（不签名）
        env:
          APP_ID: ${{ github.event.inputs.app_id || 'com.yglink.app' }}
        run: |
          set -o pipefail
          cd sing-box-for-apple
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            -derivedDataPath build/SFI.dd \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            BASE_PACKAGE_IDENTIFIER="$APP_ID" \
            INFOPLIST_KEY_CFBundleDisplayName="$APP_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee ../xcodebuild.log | tail -60
          grep -q "ARCHIVE SUCCEEDED" ../xcodebuild.log

      - name: 打包成 IPA
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'YG Link' }}
        run: |
          set -e
          APP="$(find sing-box-for-apple/build/SFI.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          echo "产物: $APP"
          rm -rf out && mkdir -p out/Payload
          # 显示名兜底：GENERATE_INFOPLIST_FILE 下 INFOPLIST_KEY_ 不一定生效，打包前直接写死
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${APP_NAME}" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${APP_NAME}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "YGLink-unsigned.ipa" Payload
          ls -lh YGLink-unsigned.ipa
          echo "--- 包内结构 ---"
          unzip -l YGLink-unsigned.ipa | head -25
          echo "--- 扩展检查 ---"
          unzip -l YGLink-unsigned.ipa | grep -E "appex|PlugIns" | head -10 || echo "没有找到 appex！"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: YGLink-unsigned-ipa
          path: out/YGLink-unsigned.ipa
          retention-days: 30

      - name: 失败时留日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: xcodebuild.log
          if-no-files-found: ignore
