name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Bundle ID 前缀（改成你自己的，别和别人撞）"
        default: "com.yglink.app"
        required: true
      app_name:
        description: "手机桌面显示名"
        default: "YG Link"
        required: true
      app_ref:
        description: "上游 sing-box-for-apple 分支/提交"
        default: "dev"
        required: true
      sb_ref:
        description: "上游 sing-box 内核分支/标签"
        default: "testing"
        required: true

env:
  SB_REPO: https://github.com/SagerNet/sing-box.git
  SB_REF: testing
  APP_REPO: https://github.com/SagerNet/sing-box-for-apple.git

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          set -e
          echo "可用 Xcode:"
          ls -d /Applications/Xcode*.app || true
          XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "使用: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: 克隆上游（内核 + Apple 客户端）
        run: |
          set -e
          git clone --depth 1 --branch "${{ github.event.inputs.sb_ref || 'testing' }}" "$SB_REPO" sing-box
          git clone --depth 1 --branch "${{ github.event.inputs.app_ref || 'dev' }}" \
            --recurse-submodules --shallow-submodules "$APP_REPO" app
          echo "内核提交: $(git -C sing-box rev-parse --short HEAD)"
          echo "客户端提交: $(git -C app rev-parse --short HEAD)"

      - name: 构建 Libbox.xcframework
        run: |
          set -e
          cd sing-box
          go run ./cmd/internal/build_libbox -target apple 2>&1 | tail -40
          XCF="$(find . -maxdepth 4 -name 'Libbox.xcframework' -type d | head -1)"
          echo "产物: $XCF"
          test -n "$XCF"
          rm -rf ../app/Libbox.xcframework
          cp -R "$XCF" ../app/Libbox.xcframework
          du -sh ../app/Libbox.xcframework

      - name: 替换品牌
        env:
          APP_ID: ${{ github.event.inputs.app_id || 'com.yglink.app' }}
          APP_NAME: ${{ github.event.inputs.app_name || 'YG Link' }}
        run: bash scripts/rebrand.sh app "$APP_ID" "$APP_NAME"

      - name: 编译（不签名）
        env:
          APP_ID: ${{ github.event.inputs.app_id || 'com.yglink.app' }}
        run: |
          set -o pipefail
          cd app
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            -derivedDataPath build/SFI.dd \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            BASE_PACKAGE_IDENTIFIER="$APP_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee ../xcodebuild.log | tail -60
          grep -q "ARCHIVE SUCCEEDED" ../xcodebuild.log

      - name: 打包成 IPA
        run: |
          set -e
          APP="$(find app/build/SFI.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          echo "产物: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry "YGLink-unsigned.ipa" Payload
          ls -lh YGLink-unsigned.ipa
          echo "--- 包内结构 ---"
          unzip -l YGLink-unsigned.ipa | head -25
          echo "--- 扩展是否存在 ---"
          unzip -l YGLink-unsigned.ipa | grep -E "appex|PlugIns" | head -10 || echo "没有找到 appex！"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: YGLink-unsigned-ipa
          path: out/YGLink-unsigned.ipa
          retention-days: 30

      - name: 失败时留日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: xcodebuild.log
          if-no-files-found: ignore

